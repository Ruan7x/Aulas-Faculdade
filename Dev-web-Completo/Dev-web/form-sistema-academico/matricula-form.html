<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Matricula</title>
</head>
<body>
    <header>
        <h1>Sistema de Cadastro de Matricula</h1>
        <h2>Faculdade Invest</h2>
    </header>
    <!--Secao de navegacao-->
   <nav>
        <a href="../sistema-academico/matriculas.html">Matriculas</a>
        <a href="../sistema-academico/index.html">Dasboard</a>
    </nav>

    <main>

        <section>
            <form action="">
                <label for="id-nomeAluno">Digite o Nome do Aluno:</label>
                <input type="text" text id="nomeAluno" name="nomeAluno" placeholder="ex: Carlos Silva" required>
                <button type="submit">Enviar</button>


                <label for="id-nomeCurso">Digite o Nome do Curso:</label>
                <input type="text" text id="nomeCurso" name="nomeCurso" placeholder="ex: Engenharia de Software" required>
                <button type="submit">Enviar</button>


                <label for="id-dataMatricula">Digite a Data da Matricula:</label>
                <input type="date" text id="dataMatricula" name="dataMatricula" placeholder="ex: 21/02/2026" required>
                <button type="submit">Enviar</button>

                <label for="id-semestreIngrecao">Digite o Semestre de Ingressão:</label>
                <input type="number" text id="semestreIngrecao" name="semestreIngrecao" placeholder="ex: 2 semestre" required>
                <button type="submit">Enviar</button>

                <label for="id-numMatricula">Digite o Numero da Matricula:</label>
                <input type="number" text id="numMatricula" name="numMatricula"  placeholder="ex: 2026001" required>
                <button type="submit">Enviar</button>  

                <label for="id-status">Digite o Status:</label>
                <input type="text" text id="status" name="status"  placeholder="ex: Ativa / Desativada" required>
                <button type="submit">Enviar</button>

            </form>

        </section>

    </main>

</body>
</html>
