<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Usuarios</title>
</head>
<body>
    <header>
        <h1>Sistema de Cadastro de Usuarios</h1>
        <h2>Faculdade Invest</h2>
    </header>
    <!--Secao de navegacao-->
   <nav>
        <a href="../sistema-academico/usuarios.html">Usuarios</a>
        <a href="../sistema-academico/index.html">Dasboard</a>
    </nav>


    <main>

        <section>
            <form action="">
                <label for="id-nomeUsuario">Digite o seu Nome:</label>
                <input type="text" text id="nomeUsuario" name="nomeUsuario" placeholder="ex: Fernanda Alves" required>
                <button type="submit">Enviar</button>


                <label for="id-emailUsuario">Digite o seu e-mail:</label>
                <input type="email" text id="emailUsuario" name="emailUsuario" placeholder="ex: fernandaalves@gmail.com" required>
                <button type="submit">Enviar</button>


                <label for="id-senha">Digite sua Senha:</label>
                <input type="password" text id="senhaUsuario" name="senhaUsuario" required>
                <button type="submit">Enviar</button>

                <label for="id-perfilUsuario">Digite o seu Perfil:</label>
                <input type="text" text id="perfilUsuario" name="perfilUsuario" placeholder="ex: Secretaria" required>
                <button type="submit">Enviar</button>

                <label for="id-statusUsuario">Digite o Status:</label>
                <input type="text" text id="statusUsuario" name="statusUsuario"  placeholder="ex: Ativa / Desativada" required>
                <button type="submit">Enviar</button> 

            </form>

        </section>

    </main>

</body>
</html>
