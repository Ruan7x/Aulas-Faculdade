<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Curso</title>
</head>
<body>
    <header>
        <h1>Sistema de Cadastro de Cursos</h1>
        <h2>Faculdade Invest</h2>
    </header>
    <!--Secao de navegacao-->
   <nav>
        <a href="../sistema-academico/index.html">Dasboard</a>
        <a href="../sistema-academico/cursos.html">Cursos</a>
    </nav>

    <main>

        <section>
            <form action="">
                <label for="id-curso">Digite o codigo do curso:</label>
                <input type="text" text id="curso" name="curso" placeholder="ex: 3988" required>
                <button type="submit">Enviar</button>


                <label for="id-nomeCurso">Digite o Nome do Curso:</label>
                <input type="text" text id="nomeCurso" name="nomeCurso" placeholder="ex: Engenharia de Software" required>
                <button type="submit">Enviar</button>


                <label for="id-descricao">Digite a Descrição do Curso:</label>
                <input type="text" text id="descricao" name="descricao" required>
                <button type="submit">Enviar</button>

                <label for="id-cargaHoraria">Digite a Carga Horaria do Curso:</label>
                <input type="number" text id="cargaHoraria" name="cargaHoraria" placeholder="ex: 750 horas" required>
                <button type="submit">Enviar</button>

                <label for="id-semestre">Digite a Duração em semestre:</label>
                <input type="number" text id="semestre" name="semestre"  placeholder="ex: 8 semestres" required>
                <button type="submit">Enviar</button>  

                <label for="id-modalidade">Digite a Modalidade:</label>
                <input type="text" text id="modalidade" name="modalidade"  placeholder="ex: Presencial / EAD / semi-Presencial" required>
                <button type="submit">Enviar</button>


                <label for="id-statusCurso">Digite o status:</label>
                <input type="text" text id="statusCurso" name="statusCurso" placeholder="ex: Ativa / Desativada" required>
                <button type="submit">Enviar</button>
            </form>   

        </section>
        
    </main>                    
                
</body>
</html>
