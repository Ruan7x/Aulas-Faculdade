<!DOCTYPE html>
<html lang="pt-BR">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Cadastro de Usuário - Sistema Acadêmico</title>
   <link rel="stylesheet" href="../estilos/style.css">
</head>
<body>
   <header>
      <h1>Sistema de Gerenciamento Acadêmico</h1>
   </header>

   
<nav>
   <ul>
      <li><a href="../sistema-academico/index.html">Dashboard</a></li>
      <li><a href="../sistema-academico/alunos.html">Alunos</a></li>
      <li><a href="../sistema-academico/cursos.html">Cursos</a></li>
      <li><a href="../sistema-academico/matriculas.html">Matrículas</a></li>
      <li><a href="../sistema-academico/usuarios.html">Usuários</a></li>
   </ul>
</nav>


   
<main>
   <section>
      <h2>Cadastro de Usuário</h2>

      <form>
         <fieldset>
            <legend>Dados do Usuário</legend>

            <label for="nome">Nome</label>
            <input
               type="text"
               id="nome"
               name="nome"
               required
               minlength="3">

            <label for="email">E-mail</label>
            <input
               type="email"
               id="email"
               name="email"
               required>

            <label for="login">Login</label>
            <input
               type="text"
               id="login"
               name="login"
               required>

            <label for="senha">Senha</label>
            <input
               type="password"
               id="senha"
               name="senha"
               required
               minlength="6">

            <label for="perfil">Perfil</label>
            <select
               id="perfil"
               name="perfil"
               required>
               <option value="">Selecione</option>
               <option value="administrador">Administrador</option>
               <option value="secretaria">Secretaria</option>
               <option value="consulta">Consulta</option>
            </select>

            <label for="status">Status</label>
            <select
               id="status"
               name="status"
               required>
               <option value="">Selecione</option>
               <option value="ativo">Ativo</option>
               <option value="inativo">Inativo</option>
            </select>
         </fieldset>

         <button type="submit">Salvar</button>
         <button type="reset" class="botao-secundario">Limpar</button>
      </form>

      <p><a href="../sistema-academico/usuarios.html">Voltar para Usuários</a></p>
   </section>
</main>


   
<footer>
   <p>© 2026 Sistema de Gerenciamento Acadêmico</p>
</footer>

</body>
</html>
