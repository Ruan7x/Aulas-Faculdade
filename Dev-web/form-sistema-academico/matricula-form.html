<!DOCTYPE html>
<html lang="pt-BR">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Cadastro de Matrícula - Sistema Acadêmico</title>
   <link rel="stylesheet" href="../estilos/style.css">
</head>
<body>
   <header>
      <h1>Sistema de Gerenciamento Acadêmico</h1>
   </header>

   
<nav>
   <ul>
      <li><a href="../sistema-academico/index.html">Dashboard</a></li>
      <li><a href="../sistema-academico/alunos.html">Alunos</a></li>
      <li><a href="../sistema-academico/matriculas.html">Cursos</a></li>
      <li><a href="../sistema-academico/matriculas.html">Matrículas</a></li>
      <li><a href="../sistema-academico/usuarios.html">Usuários</a></li>
   </ul>
</nav>


   
<main>
   <section>
      <h2>Cadastro de Matrícula</h2>

      <form>
         <fieldset>
            <legend>Dados da Matrícula</legend>

            <label for="aluno">Aluno</label>
            <select
               id="aluno"
               name="aluno"
               required>
               <option value="">Selecione um aluno</option>
               <option value="1">Ana Souza</option>
               <option value="2">Carlos Silva</option>
               <option value="3">Mariany Santos</option>
            </select>

            <label for="curso">Curso</label>
            <select
               id="curso"
               name="curso"
               required>
               <option value="">Selecione um curso</option>
               <option value="ads">Análise e Desenvolvimento de Sistemas</option>
               <option value="cc">Ciência da Computação</option>
               <option value="es">Engenharia de Software</option>
            </select>

            <label for="dataMatricula">Data da Matrícula</label>
            <input
               type="date"
               id="dataMatricula"
               name="dataMatricula"
               required>

            <label for="semestre">Semestre de Ingresso</label>
            <input
               type="text"
               id="semestre"
               name="semestre"
               required>

            <label for="numeroMatricula">Número da Matrícula</label>
            <input
               type="text"
               id="numeroMatricula"
               name="numeroMatricula"
               required>

            <label for="status">Status</label>
            <select
               id="status"
               name="status"
               required>
               <option value="">Selecione</option>
               <option value="ativa">Ativa</option>
               <option value="trancada">Trancada</option>
               <option value="cancelada">Cancelada</option>
               <option value="concluida">Concluída</option>
            </select>
         </fieldset>

         <button type="submit">Salvar</button>
         <button type="reset" class="botao-secundario">Limpar</button>
      </form>

      <p><a href="../sistema-academico/matriculas.html">Voltar para Matrículas</a></p>
   </section>
</main>


   
<footer>
   <p>© 2026 Sistema de Gerenciamento Acadêmico</p>
</footer>

</body>
</html>
