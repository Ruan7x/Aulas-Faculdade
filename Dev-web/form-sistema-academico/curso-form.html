<!DOCTYPE html>
<html lang="pt-BR">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Cadastro de Curso - Sistema Acadêmico</title>
   <link rel="stylesheet" href="../estilos/style.css">
</head>
<body>
   <header>
      <h1>Sistema de Gerenciamento Acadêmico</h1>
   </header>

   
<nav>
   <ul>
      <li><a href="../sistema-academico/index.html">Dashboard</a></li>
      <li><a href="../sistema-academico/alunos.html">Alunos</a></li>
      <li><a href="../sistema-academico/cursos.html">Cursos</a></li>
      <li><a href="../sistema-academico/matriculas.html">Matrículas</a></li>
      <li><a href="../sistema-academico/usuarios.html">Usuários</a></li>
   </ul>
</nav>


   
<main>
   <section>
      <h2>Cadastro de Curso</h2>

      <form>
         <fieldset>
            <legend>Dados do Curso</legend>

            <label for="codigo">Código</label>
            <input
               type="text"
               id="codigo"
               name="codigo"
               required
               minlength="2"
               maxlength="10">

            <label for="nome">Nome</label>
            <input
               type="text"
               id="nome"
               name="nome"
               required
               minlength="3">

            <label for="descricao">Descrição</label>
            <textarea
               id="descricao"
               name="descricao">
            </textarea>

            <label for="cargaHoraria">Carga Horária</label>
            <input
               type="number"
               id="cargaHoraria"
               name="cargaHoraria"
               min="1"
               required>

            <label for="duracao">Duração em Semestres</label>
            <input
               type="number"
               id="duracao"
               name="duracao"
               min="1"
               required>

            <label for="modalidade">Modalidade</label>
            <select
               id="modalidade"
               name="modalidade"
               required>
               <option value="">Selecione</option>
               <option value="presencial">Presencial</option>
               <option value="semipresencial">Semipresencial</option>
               <option value="ead">EAD</option>
            </select>

            <label for="status">Status</label>
            <select
               id="status"
               name="status"
               required>
               <option value="">Selecione</option>
               <option value="ativo">Ativo</option>
               <option value="inativo">Inativo</option>
            </select>
         </fieldset>

         <button type="submit">Salvar</button>
         <button type="reset" class="botao-secundario">Limpar</button>
      </form>

      <p><a href="../sistema-academico/cursos.html">Voltar para Cursos</a></p>
   </section>
</main>


   
<footer>
   <p>© 2026 Sistema de Gerenciamento Acadêmico</p>
</footer>

</body>
</html>
