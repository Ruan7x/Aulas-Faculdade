<!DOCTYPE html>
<html lang="pt-BR">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Cadastro de Aluno - Sistema Acadêmico</title>
   <link rel="stylesheet" href="../estilos/style.css">
</head>
<body>
   <header>
      <h1>Sistema de Gerenciamento Acadêmico</h1>
   </header>

   
<nav>
   <ul>
      <li><a href="../sistema-academico/index.html">Dashboard</a></li>
      <li><a href="../sistema-academico/alunos.html">Alunos</a></li>
      <li><a href="../sistema-academico/cursos.html">Cursos</a></li>
      <li><a href="../sistema-academico/matriculas.html">Matrículas</a></li>
      <li><a href="../sistema-academico/usuarios.html">Usuários</a></li>
   </ul>
</nav>


   
<main>
   <section>
      <h2>Cadastro de Aluno</h2>

      <form>
         <fieldset>
            <legend>Dados Pessoais</legend>

            <label for="nome">Nome</label>
            <input
               type="text"
               id="nome"
               name="nome"
               required
               minlength="3"
               maxlength="100">

            <label for="cpf">CPF</label>
            <input
               type="text"
               id="cpf"
               name="cpf"
               required
               minlength="11"
               maxlength="14">

            <label for="dataNascimento">Data de nascimento</label>
            <input
               type="date"
               id="dataNascimento"
               name="dataNascimento"
               required>

            <label for="email">E-mail</label>
            <input
               type="email"
               id="email"
               name="email"
               required>

            <label for="telefone">Telefone</label>
            <input
               type="text"
               id="telefone"
               name="telefone">
         </fieldset>

         <fieldset>
            <legend>Endereço</legend>

            <label for="cidade">Cidade</label>
            <input
               type="text"
               id="cidade"
               name="cidade">

            <label for="estado">Estado</label>
            <input
               type="text"
               id="estado"
               name="estado"
               maxlength="2">
         </fieldset>

         <fieldset>
            <legend>Situação Acadêmica</legend>

            <label for="status">Status</label>
            <select
               id="status"
               name="status"
               required>
               <option value="">Selecione</option>
               <option value="ativo">Ativo</option>
               <option value="inativo">Inativo</option>
               <option value="trancado">Trancado</option>
            </select>
         </fieldset>

         <button type="submit">Salvar</button>
         <button type="reset" class="botao-secundario">Limpar</button>
      </form>

      <p><a href="../sistema-academico/alunos.html">Voltar para Alunos</a></p>
   </section>
</main>


   
<footer>
   <p>© 2026 Sistema de Gerenciamento Acadêmico</p>
</footer>

</body>
</html>
